trigger:
  - none

pool:
  name: 'OnPrem_Self_Hosted_Agent_Pool_Linux_AutomationTeam'

steps:
  - task: AzureKeyVault@2
    displayName: Get Secrets from Azure Key Vault
    inputs:
      azureSubscription: 'CoO ITS DC6 (bc64219f-98a0-47d8-b44f-b48c44ee5ea4)'
      KeyVaultName: 'Automation-Prod-DC6'
      SecretsFilter: 'ACRNonProdInternalPushUsername, ACRNonProdInternalPushPassword'
      RunAsPreJob: false

  - task: Bash@3
    displayName: Build and Push Container to Registry
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        image="acrnonprodinternal.azurecr.io/automation/report-server:$(Build.SourceVersion)"
        trap 'buildah logout acrnonprodinternal.azurecr.io >/dev/null 2>&1 || true' EXIT

        buildah login \
          --username "$(ACRNonProdInternalPushUsername)" \
          --password "$(ACRNonProdInternalPushPassword)" \
          acrnonprodinternal.azurecr.io
        buildah build -f report-server.Dockerfile --network host -t "$image" .
        buildah push "$image"
